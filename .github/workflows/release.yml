name: Release

# Push a tag with the version in package.json (e.g. v0.22.1) and this builds, tests and publishes the
# GitHub release with the Windows installer (.exe) and the portable zip. "Run workflow" by hand builds
# the same files and keeps them as a downloadable artifact, without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # npm 11 may skip the dependencies' install scripts (see "allowScripts" in package.json); the build
      # needs both downloads, so run them here and fail early if either is missing
      - name: Electron runtime and the frida binding
        shell: bash
        run: |
          set -euo pipefail
          [ -f node_modules/electron/dist/electron.exe ] || node node_modules/electron/install.js
          [ -f node_modules/frida/build/frida_binding.node ] || (cd node_modules/frida && PATH="$PWD/../.bin:$PATH" node scripts/install.js)
          ls -la node_modules/electron/dist/electron.exe node_modules/frida/build/frida_binding.node

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; fi

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build the portable zip
        run: npm run dist

      - name: Build the installer
        run: npm run dist:installer

      - name: Keep the files
        uses: actions/upload-artifact@v5
        with:
          name: lootborne-planner-windows
          path: |
            release/*.zip
            release/installer/*.exe
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Lootborne Planner $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            "release/installer/Lootborne-Planner-Setup-$v.exe" \
            "release/Lootborne-Planner-v$v-win-x64.zip"
